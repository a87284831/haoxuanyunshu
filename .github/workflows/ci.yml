name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl, gd, zip, fileinfo
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: PHPUnit
        run: php vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build
