<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昊轩云枢</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑","Microsoft YaHei",sans-serif; background:#f0f2f5; color:#262626; font-size:14px; }
/* 登录页 - 左右分栏大气布局 */
#loginPage { display:flex; min-height:100vh; }
.login-brand { flex:1.1; position:relative; overflow:hidden;
  background:linear-gradient(135deg,#0f2557 0%,#1e3a8a 55%,#2563eb 100%);
  display:flex; flex-direction:column; justify-content:center; padding:0 8%; color:#fff; }
.login-brand::before, .login-brand::after { content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.06); }
.login-brand::before { width:420px; height:420px; top:-130px; right:-130px; }
.login-brand::after { width:320px; height:320px; bottom:-110px; left:-90px; }
.login-brand h1 { font-size:27px; font-weight:bold; margin-bottom:14px; letter-spacing:1px; position:relative; z-index:1; white-space:nowrap; }
.login-brand .sub { font-size:14px; color:#c7d2ea; line-height:1.9; position:relative; z-index:1; }
.login-brand .copy { position:absolute; bottom:36px; left:8%; font-size:12px; color:#8fa3cc; z-index:1; line-height:2; }
.login-side { flex:1; background:#f5f7fb; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
.login-card { background:#fff; border-radius:14px; padding:44px 40px; width:380px; max-width:100%; box-shadow:0 18px 50px rgba(15,37,87,.12); }
.login-card .welcome { font-size:20px; font-weight:bold; color:#1e3a8a; margin-bottom:6px; }
.login-card .welcome-sub { font-size:12px; color:#8c8c8c; margin-bottom:26px; }
.login-card .input-wrap { position:relative; margin-bottom:14px; }
.login-card .input-wrap .ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:15px; width:18px; text-align:center; line-height:1; pointer-events:none; }
.login-card .input-wrap input { width:100%; padding:11px 12px 11px 42px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px; background:#f8fafc; transition:all .2s; box-sizing:border-box; }
.login-card .input-wrap input:focus { outline:none; border-color:#2563eb; background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
.login-card button { width:100%; padding:12px; background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; margin-top:6px; transition:all .2s; letter-spacing:4px; }
.login-card button:hover:not(:disabled) { box-shadow:0 6px 18px rgba(37,99,235,.35); transform:translateY(-1px); }
.login-tip { margin-top:16px; font-size:12px; color:#8c8c8c; text-align:center; }
@media (max-width:760px) {
  .login-brand { display:none; }
  .login-side { flex:1; }
}
/* 主框架 */
#app { display:none; height:100vh; }
.sidebar { width:212px; background:#0f2557; color:#c7d2ea; display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .logo { padding:18px 16px; font-size:16px; font-weight:bold; color:#fff; border-bottom:1px solid rgba(255,255,255,.12); line-height:1.5; }
.sidebar .logo small { display:block; font-size:11px; color:#8fa3cc; font-weight:normal; line-height:1.6; margin-top:2px; }
/* 顶部九宫格应用启动器 */
.app-launcher { position:relative; }
.al-btn { display:inline-flex; align-items:center; gap:7px; padding:8px 15px; background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; border-radius:8px; cursor:pointer; font-size:13.5px; font-weight:600; user-select:none; transition:all .15s; }
.al-btn:hover { box-shadow:0 4px 12px rgba(37,99,235,.4); }
.al-btn .grid-ico { font-size:17px; line-height:1; }
.al-panel { position:absolute; top:100%; left:0; background:#fff; border-radius:14px; box-shadow:0 16px 48px rgba(15,37,87,.28); padding:18px 18px 14px; z-index:200; width:540px; border:1px solid #e8edf5;
  opacity:0; visibility:hidden; transform:translateY(-6px); transition:all .18s ease; pointer-events:none; }
.al-panel::after { content:""; position:absolute; top:-7px; left:26px; width:13px; height:13px; background:#fff; border-left:1px solid #e8edf5; border-top:1px solid #e8edf5; transform:rotate(45deg); }
.app-launcher:hover .al-panel, .app-launcher.open .al-panel { opacity:1; visibility:visible; transform:translateY(0); pointer-events:auto; }
.al-title { font-size:13px; color:#8c8c8c; margin-bottom:14px; padding-left:4px; font-weight:600; }
.al-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.al-item { display:flex; flex-direction:column; align-items:center; gap:9px; padding:15px 4px 12px; border-radius:11px; cursor:pointer; transition:all .15s; position:relative; }
.al-item:hover { background:#f1f5fb; transform:translateY(-2px); }
.al-item .ai-ico { width:48px; height:48px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.13); }
.al-item .ai-name { font-size:12.5px; color:#334155; white-space:nowrap; }
.al-item.current .ai-name { color:#2563eb; font-weight:700; }
.al-item .ai-badge { position:absolute; top:8px; right:10px; font-size:10px; color:#16a34a; background:#dcfce7; padding:1px 6px; border-radius:8px; }
.menu { flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; }
.menu-bottom { margin-top:auto; border-top:1px solid rgba(255,255,255,.08); padding-top:6px; }
.menu-item { padding:12px 20px; cursor:pointer; font-size:14.5px; display:flex; align-items:center; gap:10px; border-left:3px solid transparent; }
.menu-item:hover { background:rgba(255,255,255,.07); }
.menu-item.active { background:rgba(37,99,235,.32); border-left-color:#60a5fa; color:#fff; }
.menu-group { padding:10px 20px 4px; font-size:11px; color:#6d84b3; }
/* 二级菜单（一级菜单风格） */
.menu-section { padding:11px 20px; cursor:pointer; font-size:14px; color:#c7d2ea; display:flex; align-items:center; gap:10px; user-select:none; border-left:3px solid transparent; font-weight:500; }
.menu-section .ms-ico { font-size:16px; width:20px; text-align:center; }
.menu-section .ms-name { flex:1; }
.menu-section:hover { background:rgba(255,255,255,.07); color:#fff; }
.menu-section .arrow { font-size:10px; transition:transform .15s; opacity:.6; }
.menu-section.collapsed .arrow { transform:rotate(-90deg); }
.menu-sub { overflow:hidden; }
.menu-sub.collapsed { display:none; }
.menu-sub-item { padding:10px 20px 10px 50px; cursor:pointer; font-size:13.5px; color:#a9b8d4; display:flex; align-items:center; gap:8px; border-left:3px solid transparent; }
.menu-sub-item:hover { background:rgba(255,255,255,.07); color:#fff; }
.menu-sub-item.active { background:rgba(37,99,235,.32); border-left-color:#60a5fa; color:#fff; font-weight:600; }
.sidebar .userbox { padding:12px 16px; border-top:1px solid rgba(255,255,255,.12); font-size:12px; }
.sidebar .userbox .u { color:#fff; font-size:13px; margin-bottom:3px; }
.sidebar .userbox a { color:#8fa3cc; cursor:pointer; text-decoration:none; margin-right:10px; }
.sidebar .userbox a:hover { color:#fff; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.topbar { height:52px; background:#fff; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; gap:18px; padding:0 22px; }
.topbar .title { font-size:16px; font-weight:bold; color:#1f2937; }
.topbar .env { font-size:12px; color:#8c8c8c; }
/* 消息通知铃铛 */
.bell-wrap { position:relative; margin-left:auto; }
.bell-btn { position:relative; background:none; border:none; font-size:19px; cursor:pointer; padding:6px 8px; border-radius:8px; line-height:1; }
.bell-btn:hover { background:#f1f5f9; }
.bell-badge { position:absolute; top:-2px; right:-4px; min-width:16px; height:16px; padding:0 4px; background:#dc2626; color:#fff; font-size:10px; font-weight:700; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.bell-panel { position:absolute; right:0; top:40px; width:360px; max-width:86vw; background:#fff; border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.12); z-index:500; overflow:hidden; }
.bell-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid #eef0f3; font-size:13px; font-weight:600; color:#1f2937; }
.bell-act { font-size:12px; font-weight:400; color:#2563eb; cursor:pointer; }
.bell-list { max-height:420px; overflow:auto; }
.bell-item { display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid #f3f4f6; cursor:pointer; }
.bell-item:hover { background:#f8fafc; }
.bell-item.unread { background:#eff6ff; }
.bell-item.unread:hover { background:#e0edff; }
.bell-ico { flex:none; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; }
.bell-body { flex:1; min-width:0; }
.bell-t { font-size:12.5px; font-weight:600; color:#1f2937; }
.bell-c { font-size:12px; color:#6b7280; margin-top:2px; line-height:1.5; }
.bell-tm { font-size:11px; color:#9ca3af; margin-top:3px; }
.bell-empty { padding:26px 14px; text-align:center; color:#9ca3af; font-size:12.5px; }
.bell-foot { padding:8px 14px; text-align:center; font-size:12px; color:#6b7280; border-top:1px solid #f3f4f6; }
.content { flex:1; overflow:auto; padding:20px 22px; }
/* 通用组件 */
.card { background:#fff; border-radius:8px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.card h3 { font-size:14.5px; margin-bottom:12px; color:#1f2937; border-left:3px solid #2563eb; padding-left:8px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.row.end { justify-content:flex-end; }
label.fld { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#595959; }
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea {
  padding:7px 9px; border:1px solid #d9d9d9; border-radius:5px; font-size:13px; font-family:inherit; background:#fff; }
input:focus,select:focus,textarea:focus { outline:none; border-color:#2563eb; }
.btn { padding:7px 16px; border:none; border-radius:5px; font-size:13px; cursor:pointer; background:#e5e7eb; color:#374151; }
.btn:hover { filter:brightness(.96); }
.btn.primary { background:#2563eb; color:#fff; }
.btn.success { background:#16a34a; color:#fff; }
.btn.danger { background:#dc2626; color:#fff; }
.btn.warn { background:#d97706; color:#fff; }
.btn.sm { padding:4px 10px; font-size:12px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.pay-tabs { display:inline-flex; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:3px; gap:3px; }
.pay-tab { padding:8px 22px; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; background:transparent; color:#64748b; }
.pay-tab:hover { color:#1e3a8a; background:#e2e8f0; }
.pay-tab.active { background:#2563eb; color:#fff; box-shadow:0 1px 3px rgba(37,99,235,.4); }
table.tb { width:100%; border-collapse:collapse; font-size:12.5px; }
table.tb th { background:#f3f6fb; color:#475569; padding:8px 8px; border:1px solid #e5e7eb; white-space:nowrap; position:sticky; top:0; }
table.tb td { padding:7px 8px; border:1px solid #eef0f3; white-space:nowrap; }
table.tb tr:hover td { background:#f0f4ff; cursor:pointer; }
table.tb tbody tr.att-hl td { background:#bfdbfe !important; color:#1e3a8a; font-weight:600; }
table.tb tbody tr.att-hl td.num { color:#1e3a8a; }
table.tb .num { text-align:right; font-variant-numeric:tabular-nums; }
table.tb th.sticky-col, table.tb td.sticky-col { position:sticky; background:#fff; }
table.tb th.sticky-col { background:#f3f6fb; z-index:3; }
table.tb td.sticky-col { z-index:1; }
table.tb tr:hover td.sticky-col { background:#f0f4ff; }
table.tb tbody tr.att-hl td.sticky-col { background:#bfdbe6 !important; }
.table-wrap { overflow:auto; max-height:calc(100vh - 260px); border:1px solid #e5e7eb; border-radius:6px; }
.tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11.5px; }
.tag.green { background:#dcfce7; color:#15803d; } .tag.blue { background:#dbeafe; color:#1d4ed8; }
.tag.orange { background:#ffedd5; color:#c2410c; } .tag.gray { background:#f1f5f9; color:#64748b; }
.tag.red { background:#fee2e2; color:#b91c1c; } .tag.purple { background:#ede9fe; color:#6d28d9; }
.app-sec-title { font-size:13.5px; font-weight:600; color:#1e3a8a; margin:16px 0 8px; }
.app-fld-row { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid #eef0f3; border-radius:8px; margin-bottom:6px; background:#fff; font-size:13px; }
.app-form { background:#fff; border:1px solid #eef0f3; border-radius:10px; padding:14px; }
.msg { padding:9px 13px; border-radius:6px; font-size:13px; margin:10px 0; }
.msg.ok { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
.msg.err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
.msg.info { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
/* 弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; z-index:99; }
.modal { background:#fff; border-radius:10px; padding:22px 24px; width:640px; max-width:94vw; max-height:88vh; overflow:auto; }
.modal h3 { margin-bottom:14px; font-size:15px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
.form-grid .full { grid-column:1 / -1; }
.form-grid label { font-size:12.5px; color:#595959; display:flex; flex-direction:column; gap:4px; }
.form-grid input,.form-grid select { width:100%; }
.stat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
.stat { background:#fff; border-radius:8px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.stat .k { font-size:12px; color:#8c8c8c; margin-bottom:5px; }
.stat .v { font-size:20px; font-weight:bold; color:#1e3a8a; font-variant-numeric:tabular-nums; }
.hint { font-size:12px; color:#8c8c8c; line-height:1.7; margin-top:8px; }
.checkbox-list { display:flex; flex-wrap:wrap; gap:8px 14px; max-width:860px; }
.checkbox-list label { font-size:13px; display:inline-flex; gap:4px; align-items:center; background:#f8fafc; padding:4px 10px; border-radius:5px; border:1px solid #e5e7eb; cursor:pointer; }
code { background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px; }
/* 九宫格未授权态 */
.al-item.disabled { cursor:not-allowed; }
.al-item.disabled .ai-name { color:#94a3b8; }
.al-item.disabled:hover { transform:none; background:transparent; }
.ai-badge.lock { background:#f1f5f9 !important; color:#94a3b8 !important; font-size:10px; padding:1px 6px; }
/* 系统设置中心 */
.settings-wrap { display:flex; gap:18px; min-height:420px; }
.settings-side { width:168px; flex-shrink:0; border-right:1px solid #eef1f6; padding-right:12px; }
.settings-tab { padding:10px 14px; font-size:13.5px; color:#475569; cursor:pointer; border-radius:7px; margin-bottom:2px; }
.settings-tab:hover { background:#f1f5fb; color:#1e3a8a; }
.settings-tab.active { background:#e8effe; color:#1d4ed8; font-weight:600; }
.settings-content { flex:1; min-width:0; }
/* 模块权限矩阵 */
.mod-perm-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; max-height:300px; overflow-y:auto; border:1px solid #eef1f6; border-radius:8px; padding:10px; }
.mod-perm-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:6px; }
.mod-perm-row:hover { background:#f8fafc; }
.mpr-switch { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; font-weight:normal; margin:0; }
.mpr-ico { width:26px; height:26px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
.mod-role { padding:4px 8px; font-size:12px; border:1px solid #d9d9d9; border-radius:5px; background:#fff; min-width:96px; }
.mod-role:disabled { background:#f5f5f5; color:#94a3b8; }
/* 角色管理 */
.role-group { margin-bottom:16px; }
.role-group h4 { font-size:14px; color:#334155; margin:0 0 8px; display:flex; align-items:center; }
.rg-ico { width:24px; height:24px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:13px; margin-right:7px; }
.role-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid #eef1f6; border-radius:7px; margin-bottom:6px; }
.role-item .role-name { font-size:13.5px; font-weight:600; color:#1f2937; min-width:140px; }
.role-item .role-perms { font-size:12px; color:#8c8c8c; flex:1; }
.role-perm-cb { display:inline-flex !important; align-items:center; gap:4px; font-weight:normal; cursor:pointer; margin:2px 0; }
@media (max-width:900px) {
  .settings-wrap { flex-direction:column; }
  .settings-side { width:100%; border-right:none; border-bottom:1px solid #eef1f6; padding:0 0 8px; display:flex; flex-wrap:wrap; gap:4px; }
  .mod-perm-grid { grid-template-columns:1fr; }
}
/* 权限管理：账号类型 */
.perm-block { border:1px solid #eef1f6; border-radius:10px; padding:14px 16px; }
.rt-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.rt-tab { padding:6px 14px; border:1px solid #d9d9d9; border-radius:18px; font-size:13px; cursor:pointer; background:#fff; color:#475569; display:inline-flex; align-items:center; gap:6px; }
.rt-tab:hover { border-color:#4f7cff; color:#1d4ed8; }
.rt-tab.active { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
.rt-tab.new { border-style:dashed; color:#6b7280; }
.rt-del { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.25); font-size:12px; line-height:1; }
.rt-tab:not(.active) .rt-del { background:#fee2e2; color:#ef4444; }
.rt-scope { font-size:13px; color:#475569; margin-bottom:10px; display:flex; gap:18px; }
.rt-scope label { display:inline-flex; align-items:center; gap:4px; font-weight:normal; cursor:pointer; }
.rt-tree { border:1px solid #eef1f6; border-radius:8px; padding:6px 10px; max-height:320px; overflow-y:auto; }
.rt-mod { border-bottom:1px solid #f1f5f9; }
.rt-mod:last-child { border-bottom:none; }
.rt-mod-head { display:flex; align-items:center; gap:8px; padding:8px 4px; cursor:pointer; user-select:none; }
.rt-mod-head:hover { background:#f8fafc; border-radius:6px; }
.rt-mod-name { font-size:13.5px; font-weight:600; color:#1f2937; }
.rt-mod-count { font-size:11px; color:#94a3b8; margin-left:auto; }
.rt-mod.on .rt-mod-count { color:#1d4ed8; }
.rt-arrow { font-size:11px; color:#94a3b8; transition:transform .15s; }
.rt-mod.open > .rt-mod-head .rt-arrow { transform:rotate(90deg); }
.rt-mod-sub { display:none; padding:4px 4px 10px 36px; flex-wrap:wrap; gap:6px 18px; }
.rt-mod.open > .rt-mod-sub { display:flex; }
.rt-func { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:normal; cursor:pointer; color:#475569; min-width:120px; }
.role-quick-sel { padding:3px 6px; font-size:12.5px; border:1px solid #d9d9d9; border-radius:5px; background:#fff; }
/* 权限管理新版布局（钉钉/泛微风格：左角色列表 + 右详情） */
.perm-layout { display:flex; gap:0; border:1px solid #eef1f6; border-radius:12px; overflow:hidden; min-height:520px; background:#fff; }
.perm-side { width:236px; border-right:1px solid #eef1f6; background:#fafbfc; display:flex; flex-direction:column; flex-shrink:0; }
.perm-side-head { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid #eef1f6; font-size:13px; font-weight:600; color:#1f2937; }
.perm-role-list { flex:1; overflow-y:auto; padding:8px 0; }
.perm-role-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; border-left:3px solid transparent; }
.perm-role-item:hover { background:#f0f4fe; }
.perm-role-item.active { background:#e8f0fe; border-left-color:#1d4ed8; }
.perm-role-ico { width:32px; height:32px; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex-shrink:0; }

        </div>

<div id="modalRoot"></div>
<script>
/* 安全登录：主脚本较大、加载需要几秒。点登录时若 doLogin 尚未就绪，自动等待其就绪后登录，避免报「doLogin is not defined」需反复点击 */
var _safeLoginPending = false;
function safeDoLogin() {
  var tip = document.getElementById("loginTip");
  if (typeof window.doLogin === "function") {
    try { window.doLogin(); } catch (e) {
      if (tip) { tip.textContent = "登录失败：" + e.message; tip.style.color = "#dc2626"; }
    }
    return;
  }
  if (_safeLoginPending) return; // 已在等待中，防重复
  _safeLoginPending = true;
  if (tip) { tip.textContent = "正在加载系统脚本，请稍候…"; tip.style.color = "#2563eb"; }
  var t0 = Date.now();
  (function tryLogin() {
    if (typeof window.doLogin === "function") {
      _safeLoginPending = false;
      try { window.doLogin(); } catch (e) {
        if (tip) { tip.textContent = "登录失败：" + e.message; tip.style.color = "#dc2626"; }
      }
      return;
    }
    if (Date.now() - t0 > 40000) {
      _safeLoginPending = false;
      if (tip) { tip.textContent = "网络较慢，系统脚本加载超时，请刷新页面后重试"; tip.style.color = "#dc2626"; }
      return;
    }
    setTimeout(tryLogin, 120);
  })();
}
/* 前端自检：脚本未加载（如直接双击打开了本html文件）时给出明确指引 */
window.addEventListener("error", function (e) {
  if (e && e.message && e.message.indexOf("doLogin") >= 0) return; // 由 safeDoLogin 接管，不误报
  var tip = document.getElementById("loginTip");
  if (tip) { tip.textContent = "页面脚本错误：" + e.message + "。请使用 Edge 或 Chrome 浏览器，并通过双击「启动薪酬系统.bat」进入系统。"; tip.style.color = "#dc2626"; }
});
window.addEventListener("load", function () {
  setTimeout(function () {
    if (typeof doLogin !== "function") {
      var tip = document.getElementById("loginTip");
      if (tip) {
        tip.innerHTML = "⚠ 前端脚本未加载：您可能是直接打开了这个网页文件。<br><b>正确做法</b>：关闭本页，进入「薪酬计算系统」文件夹，双击「启动薪酬系统.bat」，等浏览器自动打开后再登录。";
        tip.style.color = "#dc2626";
        tip.style.lineHeight = "1.8";
      }
      var btn = document.querySelector(".login-card button");
      if (btn) btn.disabled = true;
    }
  }, 300);
});
</script>
<script src="/static/vendor/chart.umd.min.js"></script>

</html>
